# Local development stack. Frontend is added in phase 3.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flyttstad
      POSTGRES_PASSWORD: flyttstad
      POSTGRES_DB: flyttstad
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyttstad"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SECRET_KEY: dev-only-secret
      DEBUG: "True"
      DATABASE_URL: postgres://flyttstad:flyttstad@db:5432/flyttstad
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
